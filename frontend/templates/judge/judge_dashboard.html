
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../static/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../static/styles/admin/adminDashboard.css"> 
    <title>DCCMS - Dashboard</title>
</head>
{% include 'index_judge.html' %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="dashboard-container">
    <div class="stats-summary">
        <div class="stat-item">
            <i class='bx bxs-user'></i>
            <span>Total Public: {{ total_users }}</span>
        </div>
        <div class="stat-item">
            <i class='bx bxs-user-voice'></i>
            <span>Total Lawyers: {{ total_lawyers }}</span>
        </div>
        <div class="stat-item">
            <i class='bx bxs-briefcase'></i>
            <span>Total Judges: {{ total_judges }}</span>
        </div>
        <div class="stat-item">
            <i class='bx bxs-shield'></i>
            <span>Total Admins: {{ total_admins }}</span>
        </div>
        <div class="stat-item">
            <i class='bx bxs-spreadsheet'></i>
            <span>Total Cases: {{ total_cases }}</span>`
        </div>
        <div class="stat-item">
            <i class='bx bxs-hourglass'></i>
            <span>Total Events: {{ total_pending_events }}</span>
        </div>
    </div>

    <div class="recent-activities">
        <h3>Case Categories Overview</h3>
        <div class="barchart">
            <canvas id="caseCategoryChart"></canvas>
        </div>
        
    </div>

    <div class="event-status">
        <h3>Event Status Overview</h3>
            <div class="chart">
                <canvas id="eventStatusChart"></canvas>
            </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const ctx = document.getElementById('eventStatusChart').getContext('2d');

        // Create gradients for shading
        const redGradient = ctx.createLinearGradient(0, 0, 0, 400);
        redGradient.addColorStop(0, 'rgba(255, 99, 132, 0.8)');
        redGradient.addColorStop(1, 'rgba(255, 99, 132, 0.2)');

        const greenGradient = ctx.createLinearGradient(0, 0, 0, 400);
        greenGradient.addColorStop(0, 'rgba(100, 192, 192, 0.8)');
        greenGradient.addColorStop(1, 'rgba(100, 192, 192, 0.2)');

        // Data for the chart
        const data = {
            labels: ['Scheduled', 'Finished'],
            datasets: [{
                label: 'Event Status Distribution',
                data: [
                    {{ event_status[0] }}, 
                    {{ event_status[1] }}
                ],
                backgroundColor: [
                    redGradient, // Gradient for scheduled
                    greenGradient // Gradient for finished
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)', // Solid border for scheduled
                    'rgba(75, 192, 192, 1)'  // Solid border for finished
                ],
                borderWidth: 1
            }]
        };

        // Config for the chart
        const config = {
            type: 'pie',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 14,
                                family: 'Arial, sans-serif'
                            }
                        }
                    }
                },
                layout: {
                    padding: 20
                }
            }
        };

        // Render the chart
        new Chart(ctx, config);
    });

    document.addEventListener("DOMContentLoaded", function () {
        const caseCtx = document.getElementById('caseCategoryChart').getContext('2d');

        // Data for the chart (replace with backend data via Jinja2)
        const caseData = {
            labels: ['Family', 'Labor', 'Civil', 'Criminal'],
            datasets: [{
                label: '', // Remove the label from the top
                data: [
                    {{ case_counts[0] }}, // Family cases
                    {{ case_counts[1] }}, // Labor cases
                    {{ case_counts[2] }}, // Civil cases
                    {{ case_counts[3] }}  // Criminal cases
                ],
                backgroundColor: [
                    'rgba(255, 99, 132, 0.6)', // Family
                    'rgba(54, 162, 235, 0.6)', // Labor
                    'rgba(255, 206, 86, 0.6)', // Civil
                    'rgba(75, 192, 192, 0.6)'  // Criminal
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)', // Family
                    'rgba(54, 162, 235, 1)', // Labor
                    'rgba(255, 206, 86, 1)', // Civil
                    'rgba(75, 192, 192, 1)'  // Criminal
                ],
                borderWidth: 1
            }]
        };

        // Config for the bar chart
        const caseConfig = {
            type: 'bar',
            data: caseData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false // Remove the legend
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Number of Cases',
                            font: {
                                size: 14
                            }
                        },
                        ticks: {
                            precision: 0 // Ensures no decimal values
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Case Types',
                            font: {
                                size: 14
                            }
                        }
                    }
                }
            }
        };

        // Render the chart
        new Chart(caseCtx, caseConfig);
    });
</script>
</html>
