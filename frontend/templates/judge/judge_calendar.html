
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../static/images/favicon.ico" type="image/x-icon">
    <title>DCCMS - Calendar</title>
    <link rel="stylesheet" href="../static/styles/judge/calendar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.27.0/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
</head>
<body>
    <main>
        {% include 'index_judge.html' %}
        <div class="container1" id="content">
            <h1 class="my-4">Calendar</h1>
            <button id="view-scheduled-events" onclick="window.location.href='/judge/scheduled_events'">View Scheduled Events</button>
            <div id="calendar"></div>
        </div>

        <!-- Modal for Event Creation -->
        <div id="eventModal" class="modal">
            <div class="modal-content">
                <h2>Add New Event</h2>
                <label for="eventTitle">Event Title:</label>
                <input type="text" id="eventTitle" placeholder="Enter event title"><br><br>

                <label for="caseNumber">Case Number:</label>
                <select id="caseNumber">
                    <option value="" disabled selected>Select Case Number</option>
                </select><br><br>

                <label for="eventTime">Event Time:</label>
                <select id="eventHour">
                    <option value="" disabled selected>Hour</option>
                    <script>
                        for (let i = 0; i < 24; i++) {
                            document.write('<option value="' + (i < 10 ? '0' : '') + i + '">' + (i < 10 ? '0' : '') + i + '</option>');
                        }
                    </script>
                </select>
                <select id="eventMinute">
                    <option value="" disabled selected>Minute</option>
                    <script>
                        for (let i = 0; i < 60; i += 5) {
                            document.write('<option value="' + (i < 10 ? '0' : '') + i + '">' + (i < 10 ? '0' : '') + i + '</option>');
                        }
                    </script>
                </select><br><br>

                <div class="modal-buttons">
                    <button class="save-btn" id="saveEventBtn">Save Event</button>
                    <button class="close-btn" id="closeModalBtn">Cancel</button>
                </div>
            </div>
        </div>

        <script>
            $(document).ready(function () {
                let selectedStart;
            
                // Initialize the calendar
                $('#calendar').fullCalendar({
                    events: function (start, end, timezone, callback) {
                        $.ajax({
                            url: '/judge/api/events',
                            method: 'GET',
                            success: function (events) {
                                events.forEach(event => {
                                    event.color = event.status === 'finished' ? 'green' : 'blue';
                                });
                                callback(events);
                            },
                            error: function () {
                                alert('Failed to load events.');
                            }
                        });
                    },
                    selectable: true,
                    selectHelper: true,
                    select: function (start) {
                        selectedStart = start;
                        openModal();
                    },
                    editable: true,
                    eventRender: function (event, element) {
                        element.find('.fc-title').html(event.start.format('HH:mm') + ' ' + event.title);
                    }
                });
            
                function openModal() {
                    $('#content').addClass('blur-background');
                    $('#eventModal').fadeIn();
                    loadCaseNumbers(); // Load case numbers when modal opens
                }
            
                function closeModal() {
                    $('#content').removeClass('blur-background');
                    $('#eventModal').fadeOut();
                    $('#eventTitle').val('');
                    $('#caseNumber').val('');
                    $('#eventHour').val('');
                    $('#eventMinute').val('');
                }
            
                $('#saveEventBtn').on('click', function () {
                    const title = $('#eventTitle').val();
                    const caseNumber = $('#caseNumber').val();
                    const hour = $('#eventHour').val();
                    const minute = $('#eventMinute').val();
            
                    if (title && caseNumber && hour && minute) {
                        const time = `${hour}:${minute}`;
                        const startDateTime = moment(selectedStart).format('YYYY-MM-DD') + 'T' + time + ':00';
            
                        $.ajax({
                            url: '/judge/api/events',
                            method: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify({
                                title: title,
                                case_number: caseNumber,
                                event_date: moment(selectedStart).format('YYYY-MM-DD'),
                                event_time: time,
                                status: 'scheduled'
                            }),
                            success: function () {
                                alert('Event created successfully');
                                closeModal();
                                $('#calendar').fullCalendar('refetchEvents');
                            },
                            error: function (error) {
                                alert('Error creating event');
                                console.log('Error:', error.responseText);
                            }
                        });
                    } else {
                        alert('Please complete all fields.');
                    }
                });
            
                $('#closeModalBtn').on('click', closeModal);
            
                function loadCaseNumbers() {
                    $.ajax({
                        url: '/judge/get_cases',
                        method: 'GET',
                        success: function (response) {
                            if (response.status === 'success') {
                                const caseSelect = $('#caseNumber');
                                caseSelect.empty();
                                caseSelect.append('<option value="" disabled selected>Select Case Number</option>');
                                response.data.forEach(caseItem => {
                                    caseSelect.append(
                                        `<option value="${caseItem.case_number}">${caseItem.case_number} - ${caseItem.case_title}</option>`
                                    );
                                });
                            } else {
                                alert('Failed to fetch case numbers.');
                            }
                        },
                        error: function () {
                            alert('Error fetching case numbers.');
                        }
                    });
                }
            
                $('#eventModal').hide();
            });
            
        </script>
    </main>
</body>
</html>
