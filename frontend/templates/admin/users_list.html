<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Users</title>
    <link rel="stylesheet" href="../static/styles/admin/add.css" />
    {% include 'index_admin.html' %}
    <style>
      /* Style the heading */
      .heading {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
      }

      /* Style the search form */
      .search-container {
        margin-bottom: 20px;
        text-align: center;
      }

      .search-container form {
        display: inline-block;
      }

      .search-container input {
        padding: 5px;
        margin-right: 10px;
        border-radius: 5px;
        border: 1px solid #ddd;
      }

      .search-container button {
        padding: 5px 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .search-container button:hover {
        background-color: #0056b3;
      }

      /* Style the table */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      table,
      th,
      td {
        border: 1px solid #ddd;
      }

      th,
      td {
        padding: 10px;
        text-align: left;
      }

      th {
        background-color: #f4f4f4;
        font-weight: bold;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      tr:hover {
        background-color: #f1f1f1;
      }

      .view-icon {
        color: white;
        background-color: #c6d0f2;
        margin: 0 5px;
        font-size: 20px;
        padding: 5px 5px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .view-icon:hover {
        background-color: #218838;
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      }

      .edit-icon:active {
        transform: translateY(1px);
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
      }

      /* Modal styling */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        padding-top: 50px;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background-color: #fff;
        margin: auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        width: 50%;
      }

      .close-btn {
        float: right;
        font-size: 24px;
        cursor: pointer;
        color: #aaa;
      }

      .close-btn:hover {
        color: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <h1 class="heading">All Users</h1>

        <!-- Search Form -->
        <!-- Search Form -->
        <div class="search-container">
          <form id="searchForm" method="get">
            <label for="username">Search by Username:</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter username"
              value="{{ request.args.get('username', '') }}"
            />
            <button type="submit">Search</button>
          </form>
        </div>

        <!-- Users Table -->
        <table>
          <thead>
            <tr>
              
              <th>Full Name</th>
              <th>Username</th>
              <th>User Role</th>
              <th>Address</th>
              <th>email</th>
              <th>View</th>
            </tr>
          </thead>
          <tbody>
            {% if users %} {% for user in users %}
            <tr>
              
              <td>{{ user.fullname }}</td>
              <td>{{ user.username }}</td>
              <td>{{ user.role }}</td>
              <td>{{ user.address }}</td>
              <td>{{ user.email }}</td>
              <td>
                <button
                  class="view-icon"
                  onclick="viewUserDetails({{ user.id }})"
                  title="View Details"
                >
                  👁️
                  <!-- Eye icon -->
                </button>
              </td>
            </tr>
            {% endfor %} {% else %}
            <tr>
              <td colspan="6" style="text-align: center">No users found</td>
            </tr>
            {% endif %}
          </tbody>
        </table>
      </div>

      <!-- Modal -->
      <div id="userModal" class="modal">
        <div class="modal-content">
          <span class="close-btn" onclick="closeModal()">&times;</span>
          <h2>User Details</h2>
          <div id="userDetails"></div>
        </div>
      </div>
    </main>

    <script>
      function viewUserDetails(userId) {
        fetch(`/admin/get_user_details/${userId}`)
          .then((response) => {
            if (!response.ok) {
              throw new Error(
                "Failed to fetch user details: " + response.statusText
              );
            }
            return response.json();
          })
          .then((data) => {
            if (data.status === "error") {
              alert(data.message); // Alert if the user is not found
            } else {
              // Populate the modal with user details
              document.getElementById("userDetails").innerHTML = `
                        <p><strong>Full Name:</strong> ${data.fullname}</p>
                        <p><strong>Username:</strong> ${data.username}</p>
                        <p><strong>Role:</strong> ${data.role}</p>
                        <p><strong>Address:</strong> ${data.address}</p>
                        <p><strong>Contact:</strong> ${data.contact}</p>
                        <p><strong>Email:</strong> ${data.email}</p>
                        <p><strong>NIC:</strong> ${data.nic}</p>
                        <p><strong>Gender:</strong> ${data.gender}</p>
                    `;
              document.getElementById("userModal").style.display = "block";
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("An error occurred while fetching user details.");
          });
      }

      function closeModal() {
        document.getElementById("userModal").style.display = "none";
      }
    </script>
  </body>
</html>
