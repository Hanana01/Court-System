<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Hearing</title>
    <link rel="stylesheet" href="../static/styles/admin/add.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-beta.1/css/select2.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-beta.1/js/select2.min.js"></script>
    {% include 'index_admin.html' %}
</head>
<body>
<main>
    <h1 class="heading">CREATE NEW HEARING</h1>

    <div class="container">
        <form id="add-hearing-form" method="POST" novalidate>
            <div class="row">
                <div class="col-25">
                    <label for="case_number">Case Number</label>
                </div>
                <div class="col-75">
                    <input type="text" id="case_number" name="case_number" readonly required>
                </div>
            </div>

            <div class="row">
                <div class="col-25">
                    <label for="case_type">Case Type</label>
                </div>
                <div class="col-75">
                    <input type="text" id="case_type" readonly>
                </div>
            </div>

            <div class="row">
                <div class="col-25">
                    <label for="case_title">Case Title</label>
                </div>
                <div class="col-75">
                    <input type="text" id="case_title" readonly>
                </div>
            </div>

            <div class="row">
                <div class="col-25">
                    <label for="hearing_date">Hearing Date</label>
                </div>
                <div class="col-75">
                    <input type="date" id="hearing_date" name="hearing_date" required>
                </div>
            </div>

            <div class="row">
                <div class="col-25">
                    <label for="hearing_description">Hearing Description</label>
                </div>
                <div class="col-75">
                    <textarea id="hearing_description" name="hearing_description" rows="4" required></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-25">
                    <label for="highlights">Highlights</label>
                </div>
                <div class="col-75">
                    <textarea id="highlights" name="highlights" rows="4" required></textarea>
                </div>
            </div>

            <div class="row">
                <input type="submit" value="Add Hearing">
            </div>
        </form>

        <div id="message"></div>
    </div>
</main>

<script>
    $(document).ready(function () {
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event_id');
    
        if (eventId) {
            // Fetch case details from backend
            $.ajax({
                url: '/admin/get_case_details',
                method: 'GET',
                data: { event_id: eventId },
                success: function (response) {
                    console.log("Case Details:", response); // Log response data for debugging
                    // Populate fields with case details
                    $('#case_number').val(response.case_number);
                    $('#case_type').val(response.case_type);
                    $('#case_title').val(response.case_title);
                },
                error: function (xhr, status, error) {
                    console.error("Error fetching case details:", error); // Log error for debugging
                    alert('Failed to fetch case details.');
                }
            });
        }
    });
    
</script>
</body>
</html>
