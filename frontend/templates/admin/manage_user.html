<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users</title>
    <link rel="stylesheet" href="../static/styles/admin/add.css">
    {% include 'index_admin.html' %}
    <style>
        /* Style the action icons */
        .action-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .edit-icon {
            color: white; /* White for edit */
            background-color: #007bff; /* Blue background for edit */
            cursor: pointer;
            padding: 8px;
            border-radius: 10%;
            font-size: 18px;
            transition: all 0.3s ease;  
        }

        .delete-icon {
            color: white; /* White for delete */
            background-color: #dc3545; /* Red background for delete */
            cursor: pointer;
            padding: 8px;
            border-radius: 10%;
            font-size: 18px;
            transition: all 0.3s ease;  
        }

        .edit-icon:hover {
            background-color: #008bff;
            opacity: 0.9; 
            transform: translateY(-2px); 
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
          }

          .delete-icon:hover {
            background-color: #bd202f;
            opacity: 0.9; 
            transform: translateY(-2px); 
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
          }

          
          .edit-icon:active {
            transform: translateY(1px); 
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2); 
          }

        /* Style for the success message */
        .message {
            display: none;
            background-color: #28a745;
            color: white;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<main>
    <div class="container">
        <h1 class="heading">All Users</h1>

        <!-- Success Message -->
        <div id="successMessage" class="message">User deleted successfully!</div>

        <!-- Search Form -->
        <div class="search-container">
            <form id="searchForm" method="get">
                <label for="role">Search by Role:</label>
                <select name="role" id="role">
                    <option value="">All Roles</option>
                    <option value="Admin">Admin</option>
                    <option value="Judge">Judge</option>
                    <option value="Lawyer">Lawyer</option>
                    <option value="Public">Public</option>
                </select>
                <button type="submit">Search</button>
            </form>
        </div>

        <!-- Users Table -->
        <table>
            <thead>
                <tr>
                   
                    <th>Full Name</th>
                    <th>Username</th>
                    <th>User Role</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% if users %}
                    {% for user in users %}
                    <tr>
                        
                        <td>{{ user.fullname }}</td>
                        <td>{{ user.username }}</td>
                        <td>{{ user.role }}</td>
                        <td>{{ user.address }}</td>
                        <td class="action-icons">
                            <i class="edit-icon" onclick="editUser({{ user.id }})" title="Edit">&#9998; </i> <!-- Pencil icon -->
                            <i class="delete-icon" onclick="confirmDelete({{ user.id }})" title="Delete">&#128465; </i> <!-- Trash icon -->
                        </td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="6" style="text-align: center;">No users found</td>
                    </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</main>

<script>
    function editUser(userId) {
        // Redirect to the edit page with the user ID as a query parameter
        window.location.href = '/admin/edit_user?id=' + userId;
    }

    function confirmDelete(userId) {
        if (confirm('Are you sure you want to delete this user?')) {
            // Make the AJAX request to delete the user
            fetch('/admin/delete_user?id=' + userId)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // Show the success message
                        const messageDiv = document.getElementById('successMessage');
                        messageDiv.style.display = 'block';
                        setTimeout(() => {
                            messageDiv.style.display = 'none';
                        }, 5000); // Hide the message after 5 seconds
                        
                        // Optionally, you could also remove the user row from the table here
                        const row = document.querySelector(`[data-user-id="${userId}"]`);
                        if (row) row.remove();
                    } else {
                        alert(data.message); // Show an error alert if the deletion failed
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while deleting the user.');
                });
        }
    }
</script>

</body>
</html>
